services:
  frontend:
    build: ./MagnetPlay-Frontend
    image: sebastianvi1/magnetplay-frontend:latest-dev
    ports:
      - "5173:5173"
    volumes:
      - ./MagnetPlay-Frontend/src:/app/src
    depends_on:
      - backend
      - streaming-api
    env_file:
      - ./.env.dev

  torrent-api:
    build: ./Torrent-Api-py
    image: sebastianvi1/torrent-scrapper:latest-dev
    ports:
      - "8009:8009"
    env_file:
      - ./.env.dev

  backend:
    build: ./MagnetPlay-Backend
    image: sebastianvi1/magnetplay-backend:latest-dev
    depends_on:
      - torrent-api
      - db
    ports:
      - "8080:8080"
    env_file:
      - ./.env.dev
    volumes:
      - ./MagnetPlay-Backend/src:/app/src
  db:
    image: postgres:16
    env_file:
      - ./.env.dev
    ports:
      - "5432:5432"

  streaming-api:
    build: ./StreamTorrent-Api
    image: sebastianvi1/streaming-api:latest-dev
    ports:
      - "3000:3000"
    command: npx nodemon src/server.js
    env_file:
      - ./.env.dev
